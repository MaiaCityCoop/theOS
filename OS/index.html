<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheOS</title>
<style>
  :root{--bg:#0e1014;--panel:#161a20;--line:#272d37;--ink:#e8eaee;--dim:#98a2b0;--acc:#8fd0ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'Helvetica Neue',sans-serif}
  header{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0 18px 0 0;letter-spacing:.02em}
  header button{font:inherit;color:var(--dim);background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
  header button.on{color:var(--bg);background:var(--ink)}
  header span{margin-left:auto;color:var(--dim);font-size:12px}
  main{height:calc(100% - 49px);display:none}
  main.on{display:flex}
  /* the board */
  #board{flex:1;display:flex;gap:10px;padding:14px;overflow:auto;min-width:0}
  .col{flex:1;min-width:150px;background:var(--panel);border-radius:8px;padding:8px}
  .col h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:4px 6px 8px;display:flex;justify-content:space-between}
  .card{background:#1e232b;border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
  .card:hover,.card.on{border-color:var(--acc)}
  .card b{display:block;font-size:11px;color:var(--dim);font-weight:500}
  .card i{font-style:normal;font-size:11px;color:var(--acc)}
  .card.rejected{opacity:.55}
  /* a document */
  .doc{width:min(46vw,720px);border-left:1px solid var(--line);overflow:auto;padding:6px 26px 60px;display:none}
  .doc.on{display:block}
  .doc h1{font-size:22px;margin:18px 0 6px}.doc h2{font-size:15px;margin:26px 0 6px;padding-top:14px;border-top:1px solid var(--line)}.doc h3{font-size:13px;color:var(--dim)}
  .doc table{border-collapse:collapse;width:100%;font-size:13px}.doc td,.doc th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  .doc code{background:#1e232b;padding:1px 5px;border-radius:4px;font-size:12px}.doc pre{background:#1e232b;padding:10px;border-radius:6px;overflow:auto}
  .doc em{color:var(--dim)}.doc a{color:var(--acc)}.doc hr{border:0;border-top:2px solid var(--line);margin:30px 0}
  .doc li{margin:2px 0}.doc input[type=checkbox]{margin-right:6px}
  .bar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
  .bar button{font:inherit;font-size:13px;color:var(--bg);background:var(--acc);border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  .bar button.quiet{background:#2a313b;color:var(--ink)}
  .bar .state{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-left:auto}
  /* stories */
  #list{width:300px;border-right:1px solid var(--line);padding:14px;overflow:auto}
  #storydoc{flex:1;border-left:0;width:auto}
  /* the game */
  #game{flex-direction:column}
  #gamebar{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line)}
  #gamebar button{font:inherit;font-size:13px;color:var(--ink);background:#2a313b;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
  #gamebar button.on{background:var(--ink);color:var(--bg)}
  #gamebar span{margin-left:auto;color:var(--dim);font-size:12px;align-self:center}
  iframe{flex:1;border:0;width:100%;background:#000}
  .empty{color:var(--dim);padding:20px}
</style>
</head>
<body>
<header>
  <h1>TheOS</h1>
  <button data-tab="intents" class="on">Intents</button><button data-tab="stories">Stories</button><button data-tab="game">The Game</button>
  <span id="count"></span>
</header>
<main id="intents" class="on"><div id="board"></div><div id="intentdoc" class="doc"></div></main>
<main id="stories"><div id="list"></div><div id="storydoc" class="doc on"><p class="empty">Choose a story.</p></div></main>
<main id="game"><div id="gamebar"></div><iframe id="frame" allow="fullscreen; pointer-lock" title="The Game"></iframe></main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
