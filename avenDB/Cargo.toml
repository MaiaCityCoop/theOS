[package]
name = "avendb"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iroh-blobs = { version = "0.105.0", default-features = false, features = ["fs-store", "rpc"] }
loro = "1.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
bytes = "1"
n0-future = "0.3.0"
irpc = { version = "0.17", default-features = false, features = ["noq_endpoint_setup"] }
noq = { version = "1", default-features = false }

[features]
bevy = ["dep:bevy_asset", "dep:async-channel"]

[dependencies.bevy_asset]
version = "0.20.1"
optional = true
default-features = false

[dependencies.async-channel]
version = "2"
optional = true
