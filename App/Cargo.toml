[package]
name = "theos"
edition = "2024"
version = "0.1.0"
publish = false

# theOS, theKERNEL and theDB: one lock, one target
[workspace]
members = ["theKERNEL", "theDB"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui", "default_platform", "file_watcher"] }
thedb = { path = "theDB", features = ["bevy"] }
flate2 = "1.1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
