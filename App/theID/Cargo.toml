[package]
name = "theid"
version = "0.1.0"
edition = "2024"
publish = false

# Identity for the whole stack: one key type (iroh's), one way to sign, one Keychain, one set of grants (rcan); and a
# person's presence (a Secure Enclave key, P-256 because that is what the Enclave holds) for what only a person decides.
[dependencies]
iroh-base = { version = "1.5.0", features = ["key"] }
rcan = "0.4.1"
serde = { version = "1", features = ["derive"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
