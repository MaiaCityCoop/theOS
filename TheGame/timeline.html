<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox 8 · timeline</title>
<style>
  html,body{margin:0;height:100%;background:#9fc2e6;overflow:hidden;font:12px/1.35 ui-monospace,Menlo,monospace}
  canvas{display:block;width:100vw;height:100vh;pointer-events:none}
  #hud{z-index:5;position:fixed;left:8px;top:8px;color:#fff;background:rgba(0,0,0,.45);padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:none}
  #msg{display:none}
  #tl{z-index:5;position:fixed;left:0;right:0;bottom:0;background:rgba(12,14,18,.82);color:#e8eaee;padding:8px 10px 10px;backdrop-filter:blur(6px)}
  #row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  #row button{font:inherit;color:#fff;background:#2b3038;border:1px solid #444b57;border-radius:5px;padding:3px 10px;cursor:pointer;min-width:34px}
  #row a{color:#9fb6d8;margin-left:auto;text-decoration:none}
  #info{white-space:pre;overflow:hidden;text-overflow:ellipsis}
  #why{color:#aeb6c2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  #strip{position:relative;display:flex;gap:2px;height:46px;cursor:pointer;user-select:none}
  .clip{min-width:0;border-radius:4px;padding:3px 6px;color:#0d0f12;overflow:hidden;white-space:nowrap;opacity:.72;display:flex;flex-direction:column;justify-content:center}
  .clip.now{opacity:1;outline:2px solid #fff}
  .clip b{text-transform:uppercase;font-size:10px;letter-spacing:.06em}
  .clip span,.clip i{overflow:hidden;text-overflow:ellipsis;font-style:normal;font-size:10px}
  #cap{position:fixed;left:0;right:0;bottom:118px;z-index:4;text-align:center;pointer-events:none;opacity:0;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.85),0 0 2px #000;font:500 22px/1.35 -apple-system,'Helvetica Neue',sans-serif;padding:0 12vw;display:none}
  #cap.on{display:block}
  #cap small{display:block;font:600 11px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  #cap.human span{font-style:italic}#cap.human span::before{content:'“'}#cap.human span::after{content:'”'}
  #cap.title{bottom:46vh;font-size:34px;font-weight:600;letter-spacing:.01em}
  #cap.note{font-size:18px;opacity:.95}
  .mark{position:absolute;bottom:-7px;height:3px;border-radius:2px;background:#fff;opacity:.7;pointer-events:none}
  .mark.human{background:#ffd27a}.mark.agent{background:#8fd0ff}.mark.title{background:#fff}
  #head{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 4px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="cap"></div>
<div id="tl">
  <div id="row"><button id="play">▶</button><div id="info"></div><div id="why"></div></div>
  <div id="strip"><div id="head"></div></div>
</div>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/cine/view.js"></script>
</body>
</html>
