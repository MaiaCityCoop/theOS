<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maia City · film</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html,body{margin:0;height:100%;background:#9fc2e6;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  /* The film's controls, reduced to three things: play, the film as one line with the sun on it, the time. */
  #tl{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));display:flex;align-items:center;gap:16px;padding:9px 22px 9px 9px;border-radius:999px}
  #play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--sun);cursor:pointer;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  #play:hover{transform:scale(1.06)}
  #play::before{content:'';position:absolute;inset:0;background:var(--playmark) 55% 50%/15px no-repeat}
  #play.on::before{inset:auto;left:15px;top:14px;width:14px;height:16px;background:none;border-left:5px solid var(--forest);border-right:5px solid var(--forest);border-radius:3px;box-sizing:border-box}
  #meta,#acts,#cues{display:none}
  #track{order:2;flex:1;position:relative;height:26px;cursor:pointer;user-select:none}
  #segs{position:absolute;left:0;right:0;top:10px;display:flex;border-radius:999px;overflow:hidden;background:rgba(31,58,44,.16)}
  .seg{position:relative;height:6px}
  .seg u{position:absolute;left:0;top:0;bottom:0;background:var(--forest);width:0}
  #head{position:absolute;top:2px;width:22px;height:22px;margin-left:-11px;background:var(--sunmark) center/contain no-repeat;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(242,181,68,.8))}
  #time{order:3;flex:none;white-space:nowrap;font:500 13px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--forest2)}
  #time b{font-weight:600;color:var(--forest)}
  body.embed #tl{display:none}
  body:not(.embed) #cap:not(.title){bottom:104px}
  body.framed #hud{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="cap"></div>
<div id="tl" class="os-bar bottom glass">
  <button id="play" aria-label="Play or pause"></button>
  <div id="meta"><span id="act" class="label"></span><span id="shot"></span><span id="lens"></span><span id="why"></span></div>
  <span id="time"></span>
  <div id="track"><div id="segs"></div><div id="cues"></div><div id="head"></div></div>
  <div id="acts"></div>
</div>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/cine/view.js"></script>
</body>
</html>
