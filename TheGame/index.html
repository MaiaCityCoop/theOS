<!doctype html>
<html lang="en" class="os-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">   <!-- as a web app on the home screen: the picture under the status bar too (brand.css --safe-t keeps the overlays clear of it) -->
<meta name="apple-mobile-web-app-capable" content="yes">   <!-- without it iOS ignores the line above: a web app on the home screen keeps an opaque status bar and starts below it -->
<meta name="mobile-web-app-capable" content="yes">
<title>Maia City · the game</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<script src="/brand/loading.js"></script>
<style>
  html,body{margin:0;height:100%;background:var(--navy);overflow:hidden}   /* the page's background is what Safari paints its status bar and toolbar with on a phone (brand.css: the bars): the brand's blue */
  canvas{display:block;width:100vw;height:100vh}
  /* the hint: brand.css (.os-hint, .g-hint), top centre as on every game screen */
</style>
</head>
<body data-step="Waking the land">
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="stat" class="os-top os-stat glass" aria-label="Height and scale"></div>
<div id="msg" class="os-hint g-hint"></div>
<script type="module">import { boot } from '/src/boot.js'; boot({ profile: 'world' });</script>
<script type="module" src="/src/account/index.js"></script>
</body>
</html>
