<!doctype html>
<html lang="en" class="os-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maia City · lenses</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  /* the lenses: the screen's nav at the top centre, one compact pill (brand.css .os-top); what the lens shows under it as the hint */
  #panel{height:var(--pill-h);box-sizing:border-box;padding:4px;border-radius:999px;display:flex;align-items:center}
  #lensbar{display:flex;gap:2px}
  #lensbar button{height:34px;padding:0 13px;border:0;border-radius:999px;background:none;cursor:pointer;display:flex;align-items:baseline;gap:6px;white-space:nowrap;color:var(--on-glass-2);font:inherit;transition:background .2s,color .2s}
  #lensbar button:hover{background:var(--glass-hover)}
  #lensbar button.now{color:var(--on-glass);background:var(--glass-on)}
  #lensbar button{align-items:center}
  #lensbar b{font:500 14px/1 var(--glass-font);font-variant-numeric:tabular-nums}
  #lensbar span{font:450 12.5px/1 var(--glass-font)}
  #lensbar i{display:none}
  #lensbar button:not(.now) span{display:none}   /* only the chosen lens says its name; the others are their millimetres */
</style>
</head>
<body data-step="Waking the land">
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<nav id="panel" class="os-top glass" aria-label="Lenses"><div id="lensbar"></div></nav><div id="info" class="os-hint g-hint"></div>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/cine/bench.js"></script>
</body>
</html>
