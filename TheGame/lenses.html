<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maia City · lenses</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  #panel{padding:14px}
  #info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 10px 12px;color:var(--muted);font-size:13px}
  #lensbar{display:flex;gap:6px}
  #lensbar button{flex:1;min-width:0;text-align:left;background:rgba(31,58,44,.06);border:0;border-radius:22px;padding:12px 14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;white-space:nowrap;color:var(--forest2);transition:background .2s,color .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
  #lensbar button:hover{background:rgba(31,58,44,.12);transform:translateY(-2px)}
  #lensbar button.now{color:var(--cream);background:var(--forest)}
  #lensbar b{font:460 23px/1 var(--serif);font-variation-settings:var(--soft);letter-spacing:-.01em}
  #lensbar span{font:500 12.5px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis}
  #lensbar i{font:500 11px/1.3 var(--sans);font-style:normal;font-variant-numeric:tabular-nums;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="panel" class="os-bar bottom glass"><div id="info"></div><div id="lensbar"></div></div>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/cine/bench.js"></script>
</body>
</html>
