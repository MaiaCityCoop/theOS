<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox 8 · lenses</title>
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  #info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:9px;color:var(--muted)}
  #lensbar{display:flex;gap:5px}
  #lensbar button{flex:1;min-width:0;text-align:left;border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;overflow:hidden;white-space:nowrap}
  #lensbar button.now{background:var(--ink);color:#fff;box-shadow:none}
  #lensbar b{font:650 13px/1.2 var(--display)}#lensbar span,#lensbar i{font-style:normal;font-size:10.5px;font-weight:400;opacity:.7;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="panel" class="os-bar glass"><div id="info"></div><div id="lensbar"></div></div>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/cine/bench.js"></script>
</body>
</html>
