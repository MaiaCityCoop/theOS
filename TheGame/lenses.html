<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox 8 · lenses</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  #panel{padding:12px 14px 14px}
  #info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 4px 12px;color:var(--muted);font-size:12.5px}
  #lensbar{display:flex;gap:0;border-top:1px solid rgba(23,37,31,.14)}
  #lensbar button{flex:1;min-width:0;text-align:left;background:none;border:0;border-left:1px solid rgba(23,37,31,.14);padding:11px 12px 4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;white-space:nowrap;color:var(--ink-2);position:relative}
  #lensbar button:first-child{border-left:0}
  #lensbar button:hover{color:var(--forest)}
  #lensbar button.now{color:var(--forest)}
  #lensbar button.now::before{content:'';position:absolute;left:12px;right:12px;top:-1px;height:2px;background:var(--gold)}
  #lensbar b{font:400 22px/1 var(--serif);letter-spacing:-.01em}
  #lensbar span{font:500 12px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis}
  #lensbar i{font:500 10px/1.3 var(--mono);font-style:normal;color:var(--faint)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="panel" class="os-bar bottom glass"><div id="info"></div><div id="lensbar"></div></div>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module" src="/cine/bench.js"></script>
</body>
</html>
