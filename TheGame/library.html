<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maia City · library</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  /* The asset library. The middle is the live world at the library's stage: a round of bare ground in the meadow,
     the chosen asset in the middle, the camera circling it. Left, the assets; right, what the chosen one is. */
  html,body{margin:0;height:100%;background:#0f1d2c;overflow:hidden;font:14px/1.45 var(--sans);color:var(--cream)}
  canvas#c{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  #hud{display:none!important}
  #orbit{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}#orbit:active{cursor:grabbing}
  /* the two sides: light, clear glass over the world, only as tall as what they hold */
  /* light, clear glass over the world, only as large as what it holds */
  .glass2{background:linear-gradient(180deg,rgba(251,246,234,.42),rgba(251,246,234,.26));-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 12px 30px rgba(12,28,22,.16)}
  #list{position:fixed;left:14px;top:14px;z-index:3;display:flex;flex-direction:column;gap:6px;width:210px;max-height:calc(100vh - 110px);overflow:auto}
  .item{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;color:var(--forest);text-align:left;padding:6px 10px 6px 6px;border-radius:14px;cursor:pointer;font:inherit}
  .item:hover{background:rgba(251,246,234,.55)}
  .item.on{background:rgba(255,255,255,.66)}
  .item.on::before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--sun)}
  /* the library's sections: a switch at the top of the list, and a grid of them to start from */
  #tabs{display:flex;gap:2px;padding:3px;border-radius:999px;margin-bottom:4px}
  #tabs button{flex:1;border:0;background:none;font:500 11.5px/1 var(--sans);color:var(--forest2);padding:8px 0;border-radius:999px;cursor:pointer}
  #tabs button.on{background:rgba(255,255,255,.75);color:var(--navy)}
  #list[data-sec] .item, #list[data-sec] .group{display:none}
  #list[data-sec="assets"] .item[data-id], #list[data-sec="biomes"] .item[data-biome], #list[data-sec="materials"] .item[data-mat]{display:flex}
  #grid{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:rgba(15,29,44,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #grid.on{display:grid}
  #grid .cards{display:grid;grid-template-columns:repeat(3,minmax(0,200px));gap:16px;padding:16px}
  #grid h1{grid-column:1/-1;margin:0 0 4px;font:440 30px/1.1 var(--serif);font-variation-settings:var(--soft);color:var(--cream);text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  #grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px 18px;border:0;border-radius:24px;cursor:pointer;color:var(--forest);font:inherit;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  #grid button:hover{transform:translateY(-3px)}
  #grid canvas{width:96px;height:96px;filter:drop-shadow(0 6px 10px rgba(12,28,22,.3))}
  #grid b{font:460 19px/1.1 var(--serif);font-variation-settings:var(--soft);color:var(--navy)}#grid small{font-size:12px;color:var(--forest2)}
  @media (max-width:760px){#grid .cards{grid-template-columns:1fr 1fr}}
  .group{font:500 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(251,246,234,.8);text-shadow:0 1px 3px rgba(0,0,0,.45);margin:8px 0 2px 8px}.group:first-child{margin-top:2px}
  .item canvas{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 3px rgba(12,28,22,.25))}
  .item b{display:block;font:500 13.5px/1.2 var(--sans);color:var(--navy)}.item small{display:block;font-size:11.5px;color:var(--forest2);opacity:.8;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item span{min-width:0}
  .side{position:fixed;top:14px;right:14px;z-index:3;width:210px;max-height:calc(100vh - 110px);overflow:auto;padding:12px 14px;border-radius:18px;color:var(--forest)}
  .side .label{display:block;color:var(--forest2);opacity:.75;font-size:10.5px}
  .right .label{margin:0 0 6px}
  .right h2{font:460 18px/1.1 var(--serif);font-variation-settings:var(--soft);margin:0 0 6px;color:var(--navy)}
  .right p{margin:0 0 10px;color:var(--forest2);font-size:12.5px;line-height:1.4}
  .right dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:11.5px}
  .right dt{color:var(--forest2);opacity:.7}.right dd{margin:0;color:var(--forest);font-variant-numeric:tabular-nums;word-break:break-word}
  .seed{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding-top:10px;border-top:1px solid rgba(31,58,44,.12);font-size:11.5px}.seed b{font-variant-numeric:tabular-nums;color:var(--navy);flex:1}
  .seed button{font:500 11.5px/1 var(--sans);color:var(--cream);background:var(--navy);border:0;border-radius:999px;padding:7px 11px;cursor:pointer}.seed button.q{background:none;color:var(--forest2);box-shadow:inset 0 0 0 1px rgba(31,58,44,.25)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .hint{position:fixed;left:50%;transform:translateX(-50%);top:16px;z-index:2;font-size:12px;color:rgba(251,246,234,.75);text-shadow:0 1px 3px rgba(0,0,0,.5)}
  @media (max-width:760px){.side.right{display:none}#list{width:170px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="orbit"></div>
<nav id="list" aria-label="The library"></nav>
<div id="grid"><div class="cards"><h1>The library</h1></div></div>
<aside class="side right glass2" id="info"></aside>
<span class="hint">drag to circle · wheel to come closer</span>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module">
// The library: every asset (assets/index.js) on one stage: a fixed flat spot in the meadow (STAGE in
// src/world/places.js), a round of bare ground with the grass around it, the camera circling it. A placed asset
// stands in the middle; a scattered one lies there as a few of its kind, small to large.
import * as THREE from 'three';
import { ASSETS, geometryOf, materialFor, place, facesOf, scatterRow } from './assets/index.js';
import { rockSample } from './src/scatter/rocks.js';
import { STAGE } from './src/world/places.js';
import { heightAt } from './src/world.js';
import { MATERIALS, MATERIAL } from './materials/index.js';
import { materialPreview, materialThumb } from './src/materials/preview.js';
import { BIOMES, BIOME } from './biomes/index.js';
const q = new URLSearchParams(location.search), cine = window.__cine;
const hex = (c) => '#' + c.map((v) => Math.round(Math.min(1, v) * 255).toString(16).padStart(2, '0')).join('');
const ids = Object.keys(ASSETS), most = (v) => (Array.isArray(v) ? v[1] : v), span = (v) => (Array.isArray(v) ? `${v[0]} to ${v[1]}` : v);
while (!window.__s8?.U || !window.__s8?.ground) await new Promise((r) => setTimeout(r, 50));
const { scene, U, ground, tex } = window.__s8;
ground.stage(STAGE.x, STAGE.z, STAGE.r); ground.sandbox(STAGE.x, STAGE.z, BIOMES.indexOf(BIOME.meadow));   // round the stage, the land is all meadow

// the list: each asset with a small picture of its nearest level
document.getElementById('list').innerHTML = '<div id="tabs" class="glass2"><button data-s="assets">Assets</button><button data-s="biomes">Biomes</button><button data-s="materials">Materials</button><button data-s="grid" title="All sections">▦</button></div><div class="group">Assets</div>' + ids.map((id) => `<button class="item glass2" data-id="${id}"><canvas width="72" height="72"></canvas><span><b>${ASSETS[id].name}</b><small>${ASSETS[id].kind}</small></span></button>`).join('')
  + '<div class="group">Biomes</div>' + BIOMES.map((b) => `<button class="item glass2" data-biome="${b.id}"><canvas width="72" height="72"></canvas><span><b>${b.name}</b><small>${b.kind}</small></span></button>`).join('')
  + '<div class="group">Materials</div>' + MATERIALS.map((m) => `<button class="item glass2" data-mat="${m.id}"><canvas width="72" height="72"></canvas><span><b>${m.name}</b><small>${m.kind}</small></span></button>`).join('');
for (const b of document.querySelectorAll('.item[data-mat]')) {   // a material's picture: its own baked tile
  materialThumb(window.__s8.renderer, U, tex.of(b.dataset.mat), b.querySelector('canvas'));
  b.onclick = () => chooseMaterial(b.dataset.mat);
}
for (const b of document.querySelectorAll('.item[data-biome]')) {   // a biome's picture: a ball of its ground
  materialThumb(window.__s8.renderer, U, tex.of(BIOME[b.dataset.biome].floor.material), b.querySelector('canvas'));
  b.onclick = () => chooseBiome(b.dataset.biome);
}
for (const b of document.querySelectorAll('.item[data-id]')) {
  const a = ASSETS[b.dataset.id], r = new THREE.WebGLRenderer({ canvas: b.querySelector('canvas'), antialias: true, alpha: true }), sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
  sc.add(new THREE.HemisphereLight(0xdbe9ff, 0x4a5a3a, 1.4)); const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(4, 7, 3); sc.add(sun);
  sc.add(new THREE.Mesh(geometryOf(a), new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.9 })));
  const d = a.placement.at === 'scatter' ? 2.2 : Math.max(most(a.size.length), most(a.size.width), most(a.size.height)) * 1.9;
  cam.position.set(d * 0.7, d * 0.55, -d * 0.7); cam.lookAt(0, (a.placement.at === 'scatter' ? 0.5 : most(a.size.height)) * 0.4, 0);
  r.setSize(36, 36, false); r.render(sc, cam); r.dispose();
  b.onclick = () => choose(b.dataset.id);
}

// the stage: what stands on it now
let staged = null, ground0 = heightAt(STAGE.x, STAGE.z), H = 1, yaw = 2.6, pitch = 0.32, dist = 9, spin = true, seed = null;
function clearStage() { ground.stage(STAGE.x, STAGE.z, STAGE.r); ground.sandbox(STAGE.x, STAGE.z, BIOMES.indexOf(BIOME.meadow)); if (staged) { scene.remove(staged); staged.traverse((o) => o.geometry?.dispose()); staged = null; } }
function stageAsset(a) {
  clearStage();
  if (a.placement.at === 'scatter') {   // a few of its kind, small to large, lying about the middle
    staged = new THREE.Group(); const row = { ...scatterRow(a), seed: seed ?? a.placement.seed }, [lo, hi] = a.size.length;
    for (let i = 0; i < 7; i++) {
      const k = i / 6, s = lo + (hi - lo) * k ** 1.6, t = i * 2.4, rr = i ? (hi * 0.7 + 0.4) * Math.sqrt(i) * 0.55 : 0;
      const m = rockSample(U, tex, row, a.lods[0].rock, i % 3), x = STAGE.x + Math.cos(t) * rr, z = STAGE.z + Math.sin(t) * rr;   // the world's own rock: its texture, its moss
      m.scale.set(s, s * 0.8, s); m.renderOrder = 1; m.position.set(x, heightAt(x, z) - s * 0.25, z); m.rotation.y = t * 1.7; staged.add(m);   // drawn after the ground, as the world's own things are
    }
    scene.add(staged);
  } else staged = place(scene, U, a, { x: STAGE.x, z: STAGE.z, yaw: 0.6, solid: false });
}
function choose(id, keepSeed) {
  const a = ASSETS[id]; if (!keepSeed) seed = null; stageAsset(a);
  H = a.placement.at === 'scatter' ? most(a.size.height) * 0.5 : most(a.size.height);
  dist = a.placement.at === 'scatter' ? Math.max(4, most(a.size.length) * 4.5) : Math.max(most(a.size.length), most(a.size.width), most(a.size.height)) * 2.2;
  pitch = a.placement.at === 'scatter' ? 0.55 : 0.32; spin = true;
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  const s0 = a.placement.seed, seeded = s0 != null;
  const where = a.placement.at === 'scatter' ? `scattered over ${a.placement.outcrops ? 'the outcrops' : 'all the land'}, at most one every ${a.placement.cell} m` : 'stood at a named place';
  document.getElementById('info').innerHTML = `<span class="label">Asset</span><h2>${a.name}</h2><p>${a.about || ''}</p><dl>
    <dt>Kind</dt><dd style="text-transform:capitalize">${a.kind}</dd>
    <dt>Size</dt><dd>${span(a.size.length)} × ${span(a.size.width)} × ${span(a.size.height)} m</dd>
    <dt>Detail</dt><dd>${a.lods.map((l, i) => `${i ? 'then' : 'up to'} ${l.far} m · ${facesOf(l)} faces`).join('<br>')}<br>none past ${a.lods[a.lods.length - 1].far} m</dd>
    ${a.look ? `<dt>Look</dt><dd>${MATERIAL[a.look.material]?.name || "Rock"} · moss ${a.look.moss} · relief ${a.look.relief}<br>worn ${a.look.smooth} · broken ${a.look.cuts}</dd>` : ''}
    <dt>Colours</dt><dd>${Object.entries(a.colours || {}).map(([k, c]) => `<span class="sw" style="background:${hex(c)}"></span>${k}`).join('<br>')}</dd>
    <dt>Placed</dt><dd>${where}</dd>
    <dt>File</dt><dd>TheGame/assets/${a.id}.js</dd></dl>${seeded ? `<div class="seed"><span class="label" style="margin:0">Seed</span><b>${seed ?? s0}${seed != null && seed !== s0 ? '' : ' · its own'}</b>${seed != null && seed !== s0 ? '<button class="q" id="seed0">Own</button>' : ''}<button id="seedR">Random</button></div>` : ''}`;
  if (seeded) {   // a procedural asset made again from another seed: the same recipe, another of its kind; the file keeps its own
    document.getElementById('seedR').onclick = () => { seed = Math.floor(Math.random() * 100000); choose(id, true); };
    const o = document.getElementById('seed0'); if (o) o.onclick = () => { seed = null; choose(id, true); };
  }
  history.replaceState(null, '', `?${q.get('in') ? 'in=' + q.get('in') + '&' : ''}asset=${id}`);
}
// a biome: laid over all the land round the stage, the stage's bare round taken away; the river as a pond
function chooseBiome(id) {
  const b = BIOME[id]; clearStage(); ground.stage(STAGE.x, STAGE.z, 0); ground.sandbox(STAGE.x, STAGE.z, BIOMES.indexOf(b));
  H = 0.8; dist = b.where === 'water' ? 85 : 26; pitch = b.where === 'water' ? 0.55 : 0.42; spin = true;
  document.querySelectorAll('.item').forEach((e) => e.classList.toggle('on', e.dataset.biome === id));
  const g = (x) => (x ? `<span class="sw" style="background:${hex(MATERIAL[x.material].swatch.map(Math.sqrt))}"></span>${MATERIAL[x.material].name}` : '');
  document.getElementById('info').innerHTML = `<span class="label">Biome</span><h2>${b.name}</h2><p>${b.about}</p><dl>
    <dt>Kind</dt><dd style="text-transform:capitalize">${b.kind}</dd>
    <dt>Laid</dt><dd>${{ land: 'everywhere no other biome is', arid: 'where the land is dry', bank: 'along the river', water: 'in the river; here its own, meandering through the sandbox' }[b.where]}</dd>
    <dt>Ground</dt><dd>${[b.floor, b.patches, b.spots, b.slopes].filter(Boolean).map(g).join('<br>')}</dd>
    <dt>Grass</dt><dd>${b.grass ? `${Math.round(b.grass.cover * 100)} % cover${b.grass.tufts ? ', in tufts' : ''}, ${Math.round(b.grass.height * 100)} % height${b.grass.flowers ? ', flowers' : ''}` : 'none'}</dd>
    <dt>Stones</dt><dd>${b.stones ? Math.round(b.stones * 100) + ' % of cells' : 'none'}</dd>
    <dt>File</dt><dd>TheGame/biomes/${b.id}.js</dd></dl>`;
  history.replaceState(null, '', `?${q.get('in') ? 'in=' + q.get('in') + '&' : ''}biome=${id}`);
}
// a material: a ball of it in the middle of the stage, and the stage's round floor laid in it, lit like the world
const floorGeo = (() => {   // the stage's round, following the land under it
  const g = new THREE.CircleGeometry(STAGE.r + 0.2, 96, 0, Math.PI * 2); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = STAGE.x + p.getX(i), z = STAGE.z + p.getZ(i); p.setXYZ(i, x, heightAt(x, z) + 0.05, z); }
  g.computeVertexNormals(); return g;
})();
const ballGeo = new THREE.SphereGeometry(1.1, 128, 96);
function chooseMaterial(id) {
  const m = MATERIAL[id]; clearStage(); staged = new THREE.Group();
  const mat = materialPreview(U, tex.of(id), 2), y = heightAt(STAGE.x, STAGE.z);
  const fmat = materialPreview(U, tex.of(id), 2); fmat.polygonOffset = true; fmat.polygonOffsetFactor = -4; fmat.polygonOffsetUnits = -8;   // the floor always wins over the land under it
  const ball = new THREE.Mesh(ballGeo, mat), floor = new THREE.Mesh(floorGeo, fmat);
  ball.position.set(STAGE.x, y + 1.15, STAGE.z);
  for (const o of [ball, floor]) { o.renderOrder = 1; o.frustumCulled = false; staged.add(o); }
  staged.traverse = (f) => f(staged);   // its geometries are shared: nothing to free when it goes
  scene.add(staged);
  H = 1.3; dist = 9.5; pitch = 0.5; spin = true;
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.mat === id));
  document.getElementById('info').innerHTML = `<span class="label">Material</span><h2>${m.name}</h2><p>${m.about}</p><dl>
    <dt>Used by</dt><dd>${m.usedBy.replace(/; /g, '<br>')}</dd>
    <dt>Colour</dt><dd><span class="sw" style="background:${hex(m.swatch.map((v) => Math.sqrt(v)))}"></span>at a glance</dd>
    <dt>Relief</dt><dd>${m.bump} (smaller is deeper)</dd>
    <dt>Baked</dt><dd>1024² albedo + height, normal + roughness</dd>
    <dt>Number</dt><dd>${MATERIALS.indexOf(m)} in the land's shaders</dd>
    <dt>File</dt><dd>TheGame/materials/${m.id}.js</dd></dl>`;
  history.replaceState(null, '', `?${q.get('in') ? 'in=' + q.get('in') + '&' : ''}material=${id}`);
}
const orbit = document.getElementById('orbit');
orbit.onpointerdown = (e) => { spin = false; orbit.setPointerCapture(e.pointerId); orbit.onpointermove = (m) => { yaw -= m.movementX * 0.008; pitch = Math.max(0.06, Math.min(1.35, pitch + m.movementY * 0.006)); }; };
orbit.onpointerup = () => { orbit.onpointermove = null; };
orbit.onwheel = (e) => { e.preventDefault(); dist = Math.max(3, Math.min(80, dist * Math.exp(e.deltaY * 0.001))); };
function frame() {
  requestAnimationFrame(frame);
  if (spin) yaw += 0.0025;
  const ty = ground0 + H * 0.45, c = Math.cos(pitch);
  cine.take({ pos: [STAGE.x + Math.sin(yaw) * c * dist, ty + Math.sin(pitch) * dist, STAGE.z + Math.cos(yaw) * c * dist], look: [STAGE.x, ty, STAGE.z], mm: 35 });
}
// the sections: the switch over the list, the grid to start from
const SECTIONS = [
  { id: 'assets', name: 'Assets', what: 'things made and stood', n: ids.length, open: () => choose(ids[0]), pic: (c) => c.getContext('2d').drawImage(document.querySelector('.item[data-id] canvas'), 0, 0, c.width, c.height) },
  { id: 'biomes', name: 'Biomes', what: 'what lies and grows', n: BIOMES.length, open: () => chooseBiome(BIOMES[0].id), pic: (c) => materialThumb(window.__s8.renderer, U, tex.of('meadow'), c) },
  { id: 'materials', name: 'Materials', what: 'what it is all made of', n: MATERIALS.length, open: () => chooseMaterial(MATERIALS[0].id), pic: (c) => materialThumb(window.__s8.renderer, U, tex.of('rock'), c) },
];
const list = document.getElementById('list'), grid = document.getElementById('grid');
function section(id) { list.dataset.sec = id; document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.s === id)); }
for (const sct of SECTIONS) {
  const b = document.createElement('button'); b.className = 'glass2'; b.innerHTML = `<canvas width="192" height="192"></canvas><b>${sct.name}</b><small>${sct.n} · ${sct.what}</small>`;
  grid.querySelector('.cards').append(b); sct.pic(b.querySelector('canvas'));
  b.onclick = () => { grid.classList.remove('on'); section(sct.id); sct.open(); };
}
document.getElementById('tabs').onclick = (e) => {
  const s = e.target.dataset?.s; if (!s) return;
  if (s === 'grid') { grid.classList.add('on'); return; }
  section(s); SECTIONS.find((x) => x.id === s).open();
};
grid.onclick = (e) => { if (e.target === grid) grid.classList.remove('on'); };
section(q.get('biome') ? 'biomes' : q.get('material') ? 'materials' : 'assets');
if (!q.get('asset') && !q.get('biome') && !q.get('material')) grid.classList.add('on');   // the library opens on its sections
if (BIOME[q.get('biome')]) chooseBiome(q.get('biome')); else if (MATERIAL[q.get('material')]) chooseMaterial(q.get('material')); else choose(ASSETS[q.get('asset')] ? q.get('asset') : ids[0]);
requestAnimationFrame(frame);
</script>
</body>
</html>
