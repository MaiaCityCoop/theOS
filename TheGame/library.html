<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maia City · library</title>
<link rel="icon" href="/brand/MaiaCity.svg">
<link rel="stylesheet" href="/brand/brand.css">
<style>
  /* The asset library. The middle is the live world at the library's stage: a round of bare ground in the meadow,
     the chosen asset in the middle, the camera circling it. Left, the assets; right, what the chosen one is. */
  html,body{margin:0;height:100%;background:#0f1d2c;overflow:hidden;font:14px/1.45 var(--sans);color:var(--cream)}
  canvas#c{display:block;width:100vw;height:100vh;pointer-events:none}
  #msg{display:none}
  #hud{display:none!important}
  #orbit{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}#orbit:active{cursor:grabbing}
  /* the glass of every side, card and button: brand.css (.glass) */
  #list{position:fixed;left:var(--edge);top:var(--edge);z-index:3;display:flex;flex-direction:column;gap:6px;width:var(--side-w);max-height:calc(100vh - 90px);overflow:auto}
  .item{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:50px;color:var(--forest);text-align:left;padding:6px 12px 6px 7px;border-radius:18px;cursor:pointer;font:inherit}
  .item:hover{background:var(--glass-hover)}
  .item.on{background:var(--glass-on)}
  .item.on::after{content:'';flex:none;width:15px;height:15px;background:var(--sunmark) center/contain no-repeat}   /* the chosen one: brighter glass, the sun beside it */
  /* the library's sections: a switch at the top of the list, and a grid of them to start from */
  #toLib{position:fixed;left:var(--edge);bottom:var(--edge-b);z-index:7;display:flex;align-items:center;gap:8px;height:var(--pill-h);box-sizing:border-box;padding:0 18px 0 14px;border-radius:999px;cursor:pointer;font:550 14px/1 var(--glass-font);color:var(--on-glass)}
  #toLib svg{width:17px;height:13px}
  #toLib:hover{background:var(--glass-hover)}
  #grid.on ~ #toLib, #grid.on ~ #info, body:has(#grid.on) #list{display:none}   /* choosing a section: nothing else on screen */
  #list[data-sec] .item, #list[data-sec] .group{display:none}
  #list[data-sec="assets"] .item[data-id], #list[data-sec="biomes"] .item[data-biome], #list[data-sec="materials"] .item[data-mat]{display:flex}
  #list[data-sec="assets"] .group[data-g="assets"], #list[data-sec="biomes"] .group[data-g="biomes"], #list[data-sec="materials"] .group[data-g="materials"]{display:block}   /* the section's name and count over its list */
  #grid{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:rgba(15,29,44,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #grid.on{display:grid}
  #grid .cards{display:grid;grid-template-columns:repeat(3,minmax(0,200px));gap:16px;padding:16px}
  #grid h1{grid-column:1/-1;margin:0 0 4px;font:440 30px/1.1 var(--serif);font-variation-settings:var(--soft);color:var(--cream);text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  #grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px 18px;border-radius:24px;cursor:pointer;color:var(--forest);font:inherit;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  #grid button:hover{transform:translateY(-3px)}
  #grid canvas{width:112px;height:112px;filter:drop-shadow(0 6px 10px rgba(12,28,22,.3))}
  #grid .g-title{margin:0}
  @media (max-width:760px){#grid .cards{grid-template-columns:1fr 1fr}}
  .group{font:600 10.5px/1 var(--glass-font);letter-spacing:.16em;text-transform:uppercase;color:var(--on-glass-3);text-shadow:0 1px 3px rgba(0,0,0,.45);margin:6px 0 4px 10px}
  .item canvas{width:36px;height:36px;flex:none;filter:drop-shadow(0 2px 3px rgba(12,28,22,.25))}
  .item .g-sub{text-transform:capitalize}.item span{min-width:0;flex:1}
  .side{position:fixed;top:var(--edge);right:var(--edge);z-index:3;max-height:calc(100vh - 110px);overflow:auto;color:var(--forest)}   /* its width, padding and parts: brand.css (.g-card) */
  /* the words on the sides and cards: brand.css (.g-label, .g-title, .g-text, .g-fig, .g-cell, .g-chip, .g-file) */
  .seed{display:flex;align-items:center;gap:8px;font:500 12.5px/1 var(--glass-font)}.seed b{font-variant-numeric:tabular-nums;font-weight:550;color:var(--on-glass);flex:1}
    @media (max-width:760px){.side.right{display:none}#list{width:170px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="msg"></div>
<div id="orbit"></div>
<nav id="list" aria-label="The library"></nav>
<div id="grid"><div class="cards"><h1>The library</h1></div></div>
<button id="toLib" class="glass"><svg viewBox="0 0 26 20"><path d="M24 10H3M10 2.5 2.5 10 10 17.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Library</button>
<aside class="side right glass g-card" id="info"></aside>
<span class="hint os-hint g-hint">Drag to circle · wheel to come closer</span>
<script type="module" src="/cine/cine.js"></script>
<script type="module" src="/cine/menu.js"></script>
<script type="module" src="/src/main.js"></script>
<script type="module">
// The library: every asset (assets/index.js) on one stage: a fixed flat spot in the meadow (STAGE in
// src/world/places.js), a round of bare ground with the grass around it, the camera circling it. A placed asset
// stands in the middle; a scattered one lies there as a few of its kind, small to large.
import * as THREE from 'three';
import { ASSETS, geometryOf, materialFor, place, scatterRow } from './assets/index.js';
import { rockSample } from './src/scatter/rocks.js';
import { detailOf, spanOf, distanceAt } from './src/detail/index.js';
import { poseAt, heightFor } from './src/camera/rig.js';
import { STAGE } from './src/world/places.js';
import { heightAt } from './src/world.js';
import { MATERIALS, MATERIAL } from './materials/index.js';
import { materialPreview, materialThumb, dioramaThumb, sceneThumb } from './src/materials/preview.js';
import { BIOMES, BIOME } from './biomes/index.js';
const q = new URLSearchParams(location.search), cine = window.__cine;
const hex = (c) => '#' + c.map((v) => Math.round(Math.min(1, v) * 255).toString(16).padStart(2, '0')).join('');
const ids = Object.keys(ASSETS), most = (v) => (Array.isArray(v) ? v[1] : v);
// a card's pieces, as brand.css sets them (.g-card): a header, figures, a label over each value, chips, the file's line
const num = (v) => +(+v).toFixed(2), cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const head = (what, kind, name, about) => `<header><span class="g-label">${what} · ${kind}</span><h2 class="g-title big">${name}</h2><p class="g-text">${about || ''}</p></header>`;
const fig = (v, unit, label) => `<div><b class="g-fig">${v}<i>${unit}</i></b><span class="g-label">${label}</span></div>`;
const figs = (list, fit) => (list.length ? `<div class="g-figs g-part${fit ? ' fit' : ''}">${list.join('')}</div>` : '');
const cell = (label, value, wide) => `<div class="g-cell${wide ? ' wide' : ''}"><span class="g-label">${label}</span>${value}</div>`;
const say = (t) => `<span class="g-name">${t}</span>`;
const chip = (m) => `<span class="g-chip"><i style="background:${hex(MATERIAL[m].swatch.map(Math.sqrt))}"></i>${MATERIAL[m].name}</span>`;
const fileOf = (path) => `<footer class="g-part"><span class="g-file">${path}</span></footer>`;
// a size as a figure: one number in metres, or a range (in centimetres where it is all under a metre)
const sizeFig = (v, label) => (Array.isArray(v) ? (v[1] < 1 ? fig(`${num(v[0] * 100)}–${num(v[1] * 100)}`, 'cm', label) : fig(`${num(v[0])}–${num(v[1])}`, 'm', label)) : fig(num(v), 'm', label));
while (!window.__s8?.U || !window.__s8?.ground) await new Promise((r) => setTimeout(r, 50));
const { scene, U, ground, tex } = window.__s8;
ground.stage(STAGE.x, STAGE.z, STAGE.r); ground.sandbox(STAGE.x, STAGE.z, BIOMES.indexOf(BIOME.meadow));   // round the stage, the land is all meadow

// the list: each asset with a small picture of its nearest level
document.getElementById('list').innerHTML = `<div class="group" data-g="assets">Assets · ${ids.length}</div>` + ids.map((id) => `<button class="item glass flat" data-id="${id}"><canvas width="72" height="72"></canvas><span><b class="g-name">${ASSETS[id].name}</b><small class="g-sub">${ASSETS[id].kind}</small></span></button>`).join('')
  + `<div class="group" data-g="biomes">Biomes · ${BIOMES.length}</div>` + BIOMES.map((b) => `<button class="item glass flat" data-biome="${b.id}"><canvas width="72" height="72"></canvas><span><b class="g-name">${b.name}</b><small class="g-sub">${b.kind}</small></span></button>`).join('')
  + `<div class="group" data-g="materials">Materials · ${MATERIALS.length}</div>` + MATERIALS.map((m) => `<button class="item glass flat" data-mat="${m.id}"><canvas width="72" height="72"></canvas><span><b class="g-name">${m.name}</b><small class="g-sub">${m.kind}</small></span></button>`).join('');
for (const b of document.querySelectorAll('.item[data-mat]')) {   // a material's picture: its own baked tile
  materialThumb(window.__s8.renderer, U, tex.of(b.dataset.mat), b.querySelector('canvas'));
  b.onclick = () => chooseMaterial(b.dataset.mat);
}
// an asset's picture: its nearest level, lit, on nothing
function assetThumb(a, canvas, near = 1) {
  const S = canvas.width, r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }), sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
  sc.add(new THREE.HemisphereLight(0xdbe9ff, 0x4a5a3a, 1.4)); const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(4, 7, 3); sc.add(sun);
  sc.add(new THREE.Mesh(geometryOf(a), new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.9 })));
  const d = (a.placement.at === 'scatter' ? 2.2 : Math.max(most(a.size.length), most(a.size.width), most(a.size.height)) * 1.9) / near;
  cam.position.set(d * 0.7, d * 0.55, -d * 0.7); cam.lookAt(0, (a.placement.at === 'scatter' ? 0.5 : most(a.size.height)) * 0.4, 0);
  r.setPixelRatio(1); r.setSize(S, S, false); r.render(sc, cam); const out = document.createElement('canvas'); out.width = out.height = S; out.getContext('2d').drawImage(canvas, 0, 0);
  r.dispose(); canvas.replaceWith(out); out.style.cssText = canvas.style.cssText;
}
for (const b of document.querySelectorAll('.item[data-biome]')) {   // a biome's picture: a ball of its ground
  materialThumb(window.__s8.renderer, U, tex.of(BIOME[b.dataset.biome].floor.material), b.querySelector('canvas'));
  b.onclick = () => chooseBiome(b.dataset.biome);
}
// a scattered rock's picture: the largest of its kind in the world's own material (its look: pebble or rock, its moss), as on the stage
function rockThumb(a, canvas) {
  const s = most(a.size.length), m = rockSample(U, tex, scatterRow(a), a.detail.levels[0].rock, 0); m.scale.set(s, s * 0.8, s);
  sceneThumb(window.__s8.renderer, [m], canvas, [s * 2.1, s * 2.0, s * 3.3], [0, -s * 0.05, 0]);
}
for (const b of document.querySelectorAll('.item[data-id]')) {
  const a = ASSETS[b.dataset.id];
  if (a.placement.at === 'scatter') rockThumb(a, b.querySelector('canvas')); else assetThumb(a, b.querySelector('canvas'));
  b.onclick = () => choose(b.dataset.id);
}

// the stage: what stands on it now
let staged = null, ground0 = heightAt(STAGE.x, STAGE.z), H = 1, yaw = 2.6, pitch = 0.32, dist = 9, spin = true, seed = null;
let cardTab = 'info', lodAt = null;   // the asset card's tab; the level of detail being looked at (null: none chosen)
function clearStage() { ground.stage(STAGE.x, STAGE.z, STAGE.r); ground.sandbox(STAGE.x, STAGE.z, BIOMES.indexOf(BIOME.meadow)); if (staged) { scene.remove(staged); staged.traverse((o) => o.geometry?.dispose()); staged = null; } }
function stageAsset(a) {
  clearStage();
  if (a.placement.at === 'scatter') {   // a few of its kind, small to large, lying about the middle
    staged = new THREE.Group(); const row = { ...scatterRow(a), seed: seed ?? a.placement.seed }, [lo, hi] = a.size.length;
    for (let i = 0; i < 7; i++) {
      const k = i / 6, s = lo + (hi - lo) * k ** 1.6, t = i * 2.4, rr = i ? (hi * 0.7 + 0.4) * Math.sqrt(i) * 0.55 : 0;
      const m = rockSample(U, tex, row, a.detail.levels[Math.min(lodAt ?? 0, a.detail.levels.length - 1)].rock, i % 3), x = STAGE.x + Math.cos(t) * rr, z = STAGE.z + Math.sin(t) * rr;   // the world's own rock: its texture, its moss
      m.scale.set(s, s * 0.8, s); m.renderOrder = 1; m.position.set(x, heightAt(x, z) - s * 0.25, z); m.rotation.y = t * 1.7; staged.add(m);   // drawn after the ground, as the world's own things are
    }
    scene.add(staged);
  } else staged = place(scene, U, a, { x: STAGE.x, z: STAGE.z, yaw: 0.6, solid: false });
}
function choose(id, keepSeed) {
  const a = ASSETS[id]; if (!keepSeed) { seed = null; lodAt = null; } stageAsset(a);
  H = a.placement.at === 'scatter' ? most(a.size.height) * 0.5 : most(a.size.height);
  dist = a.placement.at === 'scatter' ? Math.max(4, most(a.size.length) * 4.5) : Math.max(most(a.size.length), most(a.size.width), most(a.size.height)) * 2.2;
  pitch = a.placement.at === 'scatter' ? 0.55 : 0.32; spin = true;
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
  const s0 = a.placement.seed, seeded = s0 != null;
  const scat = a.placement.at === 'scatter', where = scat ? `Scattered over ${a.placement.outcrops ? 'the outcrops' : 'all the land'}` : 'Stood at a named place';
  // what a person reads: what it is, how large, where it stands (its colours and its levels of detail are the file's)
  const info = document.getElementById('info');
  info.innerHTML = `<div class="g-tabs"><button data-tab="info" class="${cardTab === 'info' ? 'on' : ''}">Info</button><button data-tab="detail" class="${cardTab === 'detail' ? 'on' : ''}">Detail</button></div>`
    + (cardTab === 'detail' ? detailOf_(a) : head('Asset', a.kind, a.name, a.about)
    + figs(scat ? [sizeFig(a.size.length, 'Length'), fig(num(a.placement.cell), 'm', 'Apart')] : [sizeFig(a.size.length, 'Footprint'), sizeFig(a.size.height, 'Height')], scat)
    + `<div class="g-cells g-part">${cell('Placed', say(where), true)}${a.look ? cell('Look', `<div class="g-chips">${chip(a.look.material || 'rock')}</div><span class="g-sub" style="white-space:normal">moss ${a.look.moss} · relief ${a.look.relief} · worn ${a.look.smooth} · broken ${a.look.cuts}</span>`, true) : ''}</div>`
    + (seeded ? `<div class="seed g-part"><span class="g-label">Seed</span><b>${seed ?? s0}${seed != null && seed !== s0 ? '' : ' · its own'}</b>${seed != null && seed !== s0 ? '<button class="g-btn quiet" id="seed0">Own</button>' : ''}<button class="g-btn" id="seedR">Random</button></div>` : '')
    + fileOf(`TheGame/assets/${a.id}.js`));
  info.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { const d = dist, p = pitch; cardTab = b.dataset.tab; choose(id, true); dist = d; pitch = p; }));   // a tab changes the card, not the view
  info.querySelectorAll('[data-lod]').forEach((b) => (b.onclick = () => lookAtLevel(a, +b.dataset.lod)));
  if (seeded && cardTab === 'info') {   // a procedural asset made again from another seed: the same recipe, another of its kind; the file keeps its own
    document.getElementById('seedR').onclick = () => { seed = Math.floor(Math.random() * 100000); choose(id, true); };
    const o = document.getElementById('seed0'); if (o) o.onclick = () => { seed = null; choose(id, true); };
  }
  history.replaceState(null, '', `?${q.get('in') ? 'in=' + q.get('in') + '&' : ''}asset=${id}`);
}
// the Detail tab: every level of detail of the asset, each a button that takes the camera to where that level is drawn
function bands(a) {   // its levels as the detail engine resolves them (src/detail): each drawn between lo and hi pixels on screen
  const { levels, cut } = detailOf(a), faces = (l) => (l.impostor ? 2 : l.faces ? l.faces.length : 20 * 4 ** (l.rock || 0));
  const shown = a.placement.at === 'scatter' ? levels.filter((l) => !l.impostor) : levels;   // a scattered asset has no card yet
  return [...shown.map((l) => ({ i: l.i, lo: l.lo, hi: l.hi, faces: faces(l), impostor: l.impostor, views: l.views })), { i: levels.length, lo: 0, hi: cut, faces: 0 }];   // and below the last: nothing drawn
}
const span = (a) => (a.placement.at === 'scatter' ? 2 * most(a.size.length) : spanOf(a));   // a scattered rock: an icosphere of radius 1 times its size
const near0 = (a) => (a.placement.at === 'scatter' ? Math.max(4, most(a.size.length) * 4.5) : Math.max(most(a.size.length), most(a.size.width), most(a.size.height)) * 2.2);   // the close look
const pxAim = (b) => (b.hi === Infinity ? b.lo * 3 : b.lo === 0 ? b.hi / 2.5 : Math.sqrt(b.lo * b.hi));   // well inside its band
// where the camera stands to see a band: by size on screen, as the engine measures it (the lens and the governor count)
const at = (b, a) => (b.hi === Infinity ? Math.min(near0(a), (span(a) * U.uPxK.value) / (b.lo * 1.5 * U.uLodInv.value)) : (span(a) * U.uPxK.value) / (pxAim(b) * U.uLodInv.value));
function detailOf_(a) {
  const m = (v) => (v >= 1000 ? `${num(v / 1000)} km` : `${Math.round(v)} m`), p = (v) => `${num(v)} px`;
  const range = (b) => (b.hi === Infinity ? `over ${p(b.lo)}` : b.lo === 0 ? `under ${p(b.hi)}` : `${p(b.lo)} to ${p(b.hi)}`);
  return `<header><span class="g-label">${a.name} · levels of detail</span><p class="g-text" style="margin-top:8px">Each level by its size on screen; choose one and the camera goes to where it is drawn. On the right, how far that is with the walker's lens on this screen.</p></header>
    <div class="g-pick g-part">${bands(a).map((b) => `<button data-lod="${b.i}" class="${lodAt === b.i ? 'on' : ''}"><b>${b.impostor ? '◆' : b.faces ? b.i + 1 : '–'}</b><span><span class="g-name">${b.impostor ? `Card · ${b.views * b.views} views` : b.faces ? `${b.faces.toLocaleString('en')} faces` : 'Not drawn'}</span><span class="g-sub">${range(b)}</span></span><span class="g-file">${m(distanceAt(pxAim(b), span(a)))}</span></button>`).join('')}</div>`
    + fileOf(`TheGame/assets/${a.id}.js`);
}
function lookAtLevel(a, i) {
  lodAt = i; const p = Math.max(pitch, 0.25), y = yaw;
  choose(a.id, true);   // the stage again: a scattered asset's rocks at that level's own detail; a stood one hands over by itself
  dist = at(bands(a)[i], a); pitch = p; yaw = y;
}
// a biome: laid over all the land round the stage, the stage's bare round taken away; the river as a pond
function chooseBiome(id) {
  const b = BIOME[id]; clearStage(); ground.stage(STAGE.x, STAGE.z, 0); ground.sandbox(STAGE.x, STAGE.z, BIOMES.indexOf(b));
  H = 0.8; dist = b.where === 'water' ? 85 : 26; pitch = b.where === 'water' ? 0.55 : 0.42; spin = true;
  document.querySelectorAll('.item').forEach((e) => e.classList.toggle('on', e.dataset.biome === id));
  const laid = { land: 'Everywhere no other biome is', arid: 'Where the land is dry', bank: 'Along the river', water: 'In the river; here its own, meandering through the sandbox' }[b.where], pct = (v) => Math.round(v * 100);
  document.getElementById('info').innerHTML = head('Biome', b.kind, b.name, b.about)
    + figs([b.grass && fig(pct(b.grass.cover), '%', 'Grass'), b.grass && fig(pct(b.grass.height), '%', 'Height'), b.stones && fig(pct(b.stones), '%', 'Stones')].filter(Boolean))
    + `<div class="g-cells g-part">${cell('Laid', say(laid))}${cell('Grass', say(b.grass ? cap([b.grass.tufts && 'in tufts', b.grass.flowers && 'with flowers'].filter(Boolean).join(', ')) || 'Plain' : 'None'))}${cell('Ground', `<div class="g-chips">${[b.floor, b.patches, b.spots, b.slopes].filter(Boolean).map((x) => chip(x.material)).join('')}</div>`, true)}</div>`
    + fileOf(`TheGame/biomes/${b.id}.js`);
  history.replaceState(null, '', `?${q.get('in') ? 'in=' + q.get('in') + '&' : ''}biome=${id}`);
}
// a material: a ball of it in the middle of the stage, and the stage's round floor laid in it, lit like the world
const floorGeo = (() => {   // the stage's round, following the land under it
  const g = new THREE.CircleGeometry(STAGE.r + 0.2, 96, 0, Math.PI * 2); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = STAGE.x + p.getX(i), z = STAGE.z + p.getZ(i); p.setXYZ(i, x, heightAt(x, z) + 0.05, z); }
  g.computeVertexNormals(); return g;
})();
const ballGeo = new THREE.SphereGeometry(1.1, 128, 96);
function chooseMaterial(id) {
  const m = MATERIAL[id]; clearStage(); staged = new THREE.Group();
  const mat = materialPreview(U, tex.of(id), 2), y = heightAt(STAGE.x, STAGE.z);
  const fmat = materialPreview(U, tex.of(id), 2); fmat.polygonOffset = true; fmat.polygonOffsetFactor = -4; fmat.polygonOffsetUnits = -8;   // the floor always wins over the land under it
  const ball = new THREE.Mesh(ballGeo, mat), floor = new THREE.Mesh(floorGeo, fmat);
  ball.position.set(STAGE.x, y + 1.15, STAGE.z);
  for (const o of [ball, floor]) { o.renderOrder = 1; o.frustumCulled = false; staged.add(o); }
  staged.traverse = (f) => f(staged);   // its geometries are shared: nothing to free when it goes
  scene.add(staged);
  H = 1.3; dist = 9.5; pitch = 0.5; spin = true;
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.mat === id));
  document.getElementById('info').innerHTML = head('Material', m.kind, m.name, m.about)
    + figs([fig(1024, 'px', 'Baked'), fig(MATERIALS.indexOf(m), '', 'In the shaders')])
    + `<div class="g-cells g-part">${cell('Used by', say(cap(m.usedBy).replace(/; /g, '<br>')), true)}${cell('Relief', say(`${m.bump} · smaller is deeper`), true)}${cell('Baked as', say('Albedo + height, normal + roughness'), true)}</div>`
    + fileOf(`TheGame/materials/${m.id}.js`);
  history.replaceState(null, '', `?${q.get('in') ? 'in=' + q.get('in') + '&' : ''}material=${id}`);
}
const orbit = document.getElementById('orbit');
orbit.onpointerdown = (e) => { spin = false; orbit.setPointerCapture(e.pointerId); orbit.onpointermove = (m) => { yaw -= m.movementX * 0.008; pitch = Math.max(0.06, Math.min(1.35, pitch + m.movementY * 0.006)); }; };
orbit.onpointerup = () => { orbit.onpointermove = null; };
orbit.onwheel = (e) => { e.preventDefault(); dist = Math.max(3, Math.min(1500, dist * Math.exp(e.deltaY * 0.001))); };
function frame() {
  requestAnimationFrame(frame);
  if (spin) yaw += 0.0025;
  const ty = ground0 + H * 0.45, c = Math.cos(pitch);
  const p = poseAt(STAGE.x, STAGE.z, yaw, heightFor(STAGE.x, STAGE.z, yaw, dist));   // the game's one camera, held over the stage at this distance (intent 0003)
  cine.take({ pos: p.pos, look: [STAGE.x, ty, STAGE.z], mm: 35 });
}
// the sections: the switch over the list, the grid to start from
const SECTIONS = [
  { id: 'assets', name: 'Assets', what: 'things made and stood', n: ids.length, open: () => choose(ids[0]), pic: (c) => assetThumb(ASSETS.belltent, c, 1.5) },
  { id: 'biomes', name: 'Biomes', what: 'what lies and grows', n: BIOMES.length, open: () => chooseBiome(BIOMES[0].id), pic: (c) => dioramaThumb(window.__s8.renderer, U, tex, c) },
  { id: 'materials', name: 'Materials', what: 'what it is all made of', n: MATERIALS.length, open: () => chooseMaterial(MATERIALS[0].id), pic: (c) => materialThumb(window.__s8.renderer, U, tex.of('rock'), c) },
];
const list = document.getElementById('list'), grid = document.getElementById('grid');
function section(id) { list.dataset.sec = id; }
for (const sct of SECTIONS) {
  const b = document.createElement('button'); b.className = 'glass'; b.innerHTML = `<canvas width="192" height="192"></canvas><b class="g-title">${sct.name}</b><small class="g-sub">${sct.n} · ${sct.what}</small>`;
  grid.querySelector('.cards').append(b); sct.pic(b.querySelector('canvas'));
  b.onclick = () => { grid.classList.remove('on'); section(sct.id); sct.open(); };
}
document.getElementById('toLib').onclick = () => grid.classList.add('on');   // back to the library's sections
grid.onclick = (e) => { if (e.target === grid) grid.classList.remove('on'); };
section(q.get('biome') ? 'biomes' : q.get('material') ? 'materials' : 'assets');
if (!q.get('asset') && !q.get('biome') && !q.get('material')) grid.classList.add('on');   // the library opens on its sections
if (BIOME[q.get('biome')]) chooseBiome(q.get('biome')); else if (MATERIAL[q.get('material')]) chooseMaterial(q.get('material')); else choose(ASSETS[q.get('asset')] ? q.get('asset') : ids[0]);
requestAnimationFrame(frame);
</script>
</body>
