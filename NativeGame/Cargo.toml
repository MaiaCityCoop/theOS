[package]
name = "nativegame"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui", "default_platform"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
