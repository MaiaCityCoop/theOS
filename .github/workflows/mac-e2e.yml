name: TheGame E2E

# The Mac runs install, build and the browser test inside a disposable Tart VM.

on:
  workflow_dispatch:
  push:
    branches: [main, test/e2e-first-screen]

permissions:
  contents: read

concurrency:
  group: mac-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger build and test on Mac
        id: trigger
        env:
          MAC_E2E_HMAC: ${{ secrets.MAC_E2E_HMAC }}
        run: |
          set -euo pipefail
          base=https://trigger.aven.ceo
          body=$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg test "first-screen" \
            '{repo:"MaiaCityCoop/theOS",sha:$sha,ref:$ref,test:$test}')
          ts=$(date +%s)
          sig=$(printf '%s\n%s\n%s\n%s' "$ts" POST /runs "$body" \
            | openssl dgst -sha256 -hmac "$MAC_E2E_HMAC" \
            | awk '{print $NF}')
          response=$(curl -fsS --max-time 30 \
            -X POST "$base/runs" \
            -H 'content-type: application/json' \
            -H "x-timestamp: $ts" \
            -H "x-signature: $sig" \
            --data-binary "$body")
          echo "$response"
          run_id=$(jq -r '.run_id' <<<"$response")
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Mac E2E screenshot
        id: wait
        env:
          MAC_E2E_HMAC: ${{ secrets.MAC_E2E_HMAC }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          base=https://trigger.aven.ceo
          path="/runs/$RUN_ID"
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            ts=$(date +%s)
            sig=$(printf '%s\n%s\n%s\n' "$ts" GET "$path" \
              | openssl dgst -sha256 -hmac "$MAC_E2E_HMAC" \
              | awk '{print $NF}')
            curl -fsS --max-time 30 \
              -H "x-timestamp: $ts" \
              -H "x-signature: $sig" \
              "$base$path" > run.json
            state=$(jq -r '.state' run.json)
            echo "state=$state"
            case "$state" in
              passed)
                screenshot=$(jq -r '.screenshot' run.json)
                echo "screenshot=$screenshot"
                if [ "$screenshot" != "true" ]; then
                  echo "state=passed_without_screenshot" >> "$GITHUB_OUTPUT"
                  echo "Mac test passed but no screenshot was produced" >&2
                  exit 1
                fi
                echo "state=passed" >> "$GITHUB_OUTPUT"
                jq . run.json
                exit 0
                ;;
              failed)
                echo "state=failed" >> "$GITHUB_OUTPUT"
                jq . run.json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Mac E2E" >&2
          echo "state=timeout" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Download Mac E2E artifacts
        if: always()
        env:
          MAC_E2E_HMAC: ${{ secrets.MAC_E2E_HMAC }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -uo pipefail
          base=https://trigger.aven.ceo
          failed=0
          for item in log screenshot; do
            path="/runs/$RUN_ID/$item"
            ts=$(date +%s)
            sig=$(printf '%s\n%s\n%s\n' "$ts" GET "$path" \
              | openssl dgst -sha256 -hmac "$MAC_E2E_HMAC" \
              | awk '{print $NF}')
            if [ "$item" = log ]; then
              out=mac-e2e.log
              curl -fsS --max-time 60 \
                -H "x-timestamp: $ts" \
                -H "x-signature: $sig" \
                "$base$path" -o "$out" || true
            else
              out=first-screen.png
              if ! curl -fsS --max-time 60 \
                -H "x-timestamp: $ts" \
                -H "x-signature: $sig" \
                "$base$path" -o "$out"; then
                failed=1
              fi
              if [ ! -s "$out" ] || ! file "$out" | grep -q 'PNG image data'; then
                echo 'screenshot missing or not a PNG' >&2
                failed=1
              fi
            fi
          done
          ls -l mac-e2e.log first-screen.png 2>/dev/null || true
          exit "$failed"

      - name: Upload Mac E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-e2e-${{ github.sha }}
          path: |
            mac-e2e.log
            first-screen.png
          if-no-files-found: ignore
