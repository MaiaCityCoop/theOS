name: Game

# Checks and builds TheGame for every change to it. On main, it also deploys to `next` when the repository
# variable AUTO_DEPLOY_NEXT is "true" (TheGame/deploy/README.md).
on:
  push:
    branches: [main]
    paths: [TheGame/**, .github/workflows/game.yml, .github/workflows/deploy-game.yml]
  pull_request:
    paths: [TheGame/**, .github/workflows/game.yml, .github/workflows/deploy-game.yml]

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: TheGame
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Sign-in checks
        run: bun tools/account-check.js
      - name: Build
        run: bun run build
      - name: Shell scripts parse
        run: |
          bash -n deploy/bundle.sh deploy/setup-host.sh
          sh -n deploy/deploy.sh

  next:
    needs: check
    if: github.event_name == 'push' && vars.AUTO_DEPLOY_NEXT == 'true'
    uses: ./.github/workflows/deploy-game.yml
    with:
      environment: next
      commit: ${{ github.sha }}
    secrets: inherit
